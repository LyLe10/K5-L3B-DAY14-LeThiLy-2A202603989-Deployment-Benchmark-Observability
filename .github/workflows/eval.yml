name: quality-gate
on: [pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run agent and evaluate quality
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: |
          python -m pip install -r requirements.txt
          AGENT_VERSION=v2 PORT=8002 MOCK_ERROR_RATE=0 python app.py &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true; wait "$agent_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 1 http://localhost:8002/health > /dev/null; then
              break
            fi
            kill -0 "$agent_pid"
            sleep 1
          done
          curl --fail --silent --show-error --max-time 1 http://localhost:8002/health > /dev/null
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85
